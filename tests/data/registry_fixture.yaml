# FIXTURE DE TEST — registre de gouvernance « forme historique ».
#
# Ce fichier N'EST PAS le registre servi par AI Gateway Open (voir
# app/models_registry.yaml, profil Compact). Il reproduit la FORME du registre
# de l'installation d'origine — profils de contexte, budgets de sortie,
# politiques de raisonnement (toggle / niveaux), profils vision et ASR — afin
# que la suite de tests héritée (gouvernance, différentiels, identité de
# pipeline) continue de prouver les mêmes invariants. Les noms de modèles sont
# des tags publics des bibliothèques Ollama / HuggingFace ; les digests et
# révisions sont ceux des artefacts publics. Aucune mesure, aucun hôte, aucune
# information d'exploitation : les commentaires d'origine ont été retirés.
#
# Chargé par tests/conftest.py via AI_GATEWAY_MODELS_REGISTRY. Les tests de
# conformité Open (tests/open/) chargent, eux, le registre Compact réel.
