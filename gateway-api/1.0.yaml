  headers:
    X-Request-ID:
      description: 'Identifiant de corrélation : relayé s''il respecte ^[A-Za-z0-9._:-]{1,128}$, généré (UUID v4) sinon. Présent
        sur toute réponse.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
    Retry-After:
      description: Délai de politesse (secondes entières) avant nouvel essai sur une saturation 503.
      schema:
        type: integer
        minimum: 1
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Identifiant de corrélation fourni par le client (optionnel).
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
servers:
- url: http://127.0.0.1:8100
  description: Gateway locale (boucle locale)
x-gateway-contract:
  status: CANDIDATE_FOR_RATIFICATION
  version: 1.0.0-candidate.2
  ratification: pending
  required_routes:
  - GET /health/runtime
  - GET /health/live
  - GET /v1/models
  - POST /v1/generate
  - POST /v1/generate/stream
  - POST /v1/embeddings
  - POST /v1/rerank
  optional_capabilities_default_off:
  - asr
  - vision
  - chat
  not_included:
  - semantic_extract
  - structured_extract
  - v2h
  - host_admission_controller
  capability_states:
  - ENABLED
  - DISABLED
  - UNAVAILABLE
  - UNKNOWN
  model_substitution: never — le nom demandé est résolu (logique -> tag) ou refusé
  external_providers: none — runtime local uniquement, aucun repli cloud, aucun téléchargement à la requête
x-gateway-error-codes:
- code: model_not_registered
  http_status: 400
  retryable: false
  where: generate, chat, embeddings (registre strict)
- code: completion_not_supported
  http_status: 400
  retryable: false
  where: 'generate : modèle sans capability completion'
- code: chat_not_supported
  http_status: 400
  retryable: false
  where: 'chat : modèle sans capability chat'
- code: structured_output_not_supported
  http_status: 400
  retryable: false
  where: 'generate/chat : capability absente'
- code: structured_output_reasoning_incompatible
  http_status: 400
  retryable: false
  where: 'generate : canal de raisonnement actif'
- code: structured_output_streaming_not_supported
  http_status: 400
  retryable: false
  where: generate/stream, chat/stream
- code: generate_format_conflict
  http_status: 400
  retryable: false
  where: 'generate : format et response_format exclusifs'
- code: keep_alive_not_overridable
  http_status: 400
  retryable: false
  where: 'generate/chat : profil de rétention verrouillé'
- code: embedding_dimension_incompatible
  http_status: 400
  retryable: false
  where: 'embeddings : dimension ≠ index'
- code: invalid_content_length
  http_status: 400
  retryable: false
  where: middleware
- code: length_required
  http_status: 411
  retryable: false
  where: 'middleware : POST JSON sans Content-Length'
- code: request_too_large
  http_status: 413
  retryable: false
  where: 'middleware : Content-Length > AI_GATEWAY_REQUEST_MAX_BYTES'
- code: output_empty
  http_status: 502
  retryable: false
  where: sortie structurée vide
- code: output_invalid
  http_status: 502
  retryable: false
  where: sortie structurée non JSON strict
- code: output_mismatch
  http_status: 502
  retryable: false
  where: sortie structurée non conforme
- code: unsupported_upstream_response
  http_status: 502
  retryable: false
  where: 'chat : tool_calls sans outil'
- code: model_not_installed
  http_status: 503
  retryable: false
  where: 'generate, chat, embeddings : modèle absent du runtime (aucun téléchargement)'
- code: generation_saturated
  http_status: 503
  retryable: true
  where: generate, generate/stream, chat, chat/stream (+Retry-After)
- code: embeddings_saturated
  http_status: 503
  retryable: true
  where: embeddings (+Retry-After)
- code: rerank_saturated
  http_status: 503
  retryable: true
  where: rerank (+Retry-After)
- code: vision_not_enabled
  http_status: 503
  retryable: false
  where: 'vision : capacité OFF'
- code: vision_task_unavailable
  http_status: 503
  retryable: false
  where: 'vision : semantic_extract non inclus'
- code: vision_overloaded
  http_status: 503
  retryable: true
  where: vision (+Retry-After)
- code: asr_unavailable
  http_status: 503
  retryable: true
  where: 'asr : capacité OFF ou backend absent'
- code: resource_saturated
  http_status: 503
  retryable: true
  where: asr (+Retry-After)
x-gateway-limits:
  timeout_seconds_default: 60
  request_max_bytes_default: 2097152
  generate_max_concurrency_default: 2
  embeddings_max_concurrency_default: 2
  rerank_max_concurrency_default: 2
  embeddings_max_batch_default: 64
  embeddings_dimension_default: 768
  retry_after_seconds:
    generation_saturated: 2
    embeddings_saturated: 1
    rerank_saturated: 1
    vision_overloaded: 10
  model_name_pattern: ^[A-Za-z0-9._:/-]+$
  model_name_max_chars: 256
x-gateway-embeddings-identity:
  pipeline_id_format: emb-v2:<sha256[:32] du payload canonique>
  payload_fields:
  - schema
  - model_digest
  - task
  - prefix
  - overflow
  - normalized
  - implementation
  response_fields:
  - pipeline_id
  - expected_digest
  - model_digest
  - identity_verified
  - verified_at
  - governed
  - normalized
  - dimension
  compact_v1_dimension: 768
x-gateway-pool-compatibility:
  request_id_header: X-Request-ID
  gateway_never_emits_headers_prefixed: X-AIGP-
  distinguishable_errors: detail.code + detail.retryable + HTTP status
  streaming: NDJSON relayé octet pour octet ; Content-Type application/x-ndjson
