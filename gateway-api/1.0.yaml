openapi: 3.1.0
info:
  title: AI Gateway Open — gateway-api
  version: 1.0.0-candidate.2
  description: 'Contrat API commun RAGatm Open / AI Gateway Open / AI Gateway Pool Open. État : CANDIDATE_FOR_RATIFICATION
    (ratification en attente). Dérivé des schémas réellement implémentés (app/schemas.py) par tools/build_openapi.py ; toute
    divergence avec l''API servie est détectée par tests/open/test_open_openapi_conformance.py.'
paths:
  /health/live:
    get:
      summary: Health Live
      description: 'Processus vivant et registre chargé. AUCUN appel réseau, AUCUNE

        inférence, AUCUN chargement : c''est la sonde destinée au healthcheck

        Docker et au monitoring automatique. Les sondes inférentielles

        (/health/ready, /health/embeddings, /health/rerank) sont explicites et ne

        doivent jamais être branchées sur un battement automatique.'
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Live Health Live Get
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '502':
          description: Upstream en échec, délai ou sortie hors contrat
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '503':
          description: Capacité désactivée, modèle non installé, saturation ou upstream indisponible
          content:
            application/json:
              schema: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      x-gateway-capability:
        name: health
        default_state: ENABLED
        required_for_compact: true
      x-gateway-inferential: false
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
