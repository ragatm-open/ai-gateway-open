  /v1/generate/stream:
    post:
      summary: Generate Stream
      description: 'Génération en flux NDJSON.


        Une ligne JSON par événement : `{"type":"delta",...}` pour chaque fragment,

        puis exactement un `{"type":"done",...}` portant les comptes de tokens. Une

        rupture en cours de flux produit `{"type":"error",...}` et jamais de `done`.'
      operationId: generate_stream_v1_generate_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
        required: true
      responses:
        '200':
          description: 'Flux NDJSON (application/x-ndjson, PAS du SSE) : une ligne JSON par événement ; exactement un `done`
            par flux réussi ; un flux en erreur émet `error` et jamais `done`.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/x-ndjson:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GenerateStreamDelta'
                - $ref: '#/components/schemas/GenerateStreamDone'
                - $ref: '#/components/schemas/GenerateStreamError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '400':
          description: Requête ou gouvernance refusée
          content:
            application/json:
              schema: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '502':
          description: Upstream en échec, délai ou sortie hors contrat
          content:
            application/json:
              schema: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
        '503':
          description: Capacité désactivée, modèle non installé, saturation ou upstream indisponible
          content:
            application/json:
              schema: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        '413':
          description: Corps > AI_GATEWAY_REQUEST_MAX_BYTES (request_too_large)
          content:
            application/json:
              schema: *id001
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      x-gateway-stream:
        media_type: application/x-ndjson
        framing: ndjson
        events:
        - delta
        - done
        - error
        client_cancellation: fermer la connexion ferme l'appel upstream
      x-gateway-capability:
        name: generation
        default_state: ENABLED
        required_for_compact: true
      x-gateway-inferential: true
